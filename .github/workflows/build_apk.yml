name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Generate Android Project Files
      run: flutter create . --platforms=android --project-name=syria_grade2_app

    - name: Set App Display Name
      run: |
        python3 -c '
        path = "android/app/src/main/AndroidManifest.xml"
        with open(path, "r", encoding="utf-8") as f:
            content = f.read()
        content = content.replace("syria_grade2_app", "سِراج").replace("@string/app_name", "سِراج")
        with open(path, "w", encoding="utf-8") as f:
            f.write(content)
        '

    - name: Install ImageMagick
      run: sudo apt-get update && sudo apt-get install -y imagemagick

    - name: Generate App Icons
      run: |
        mkdir -p android/app/src/main/res/mipmap-hdpi
        mkdir -p android/app/src/main/res/mipmap-mdpi
        mkdir -p android/app/src/main/res/mipmap-xhdpi
        mkdir -p android/app/src/main/res/mipmap-xxhdpi
        mkdir -p android/app/src/main/res/mipmap-xxxhdpi
        convert -background none assets/icon/siraj_icon.svg -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher.png
        convert -background none assets/icon/siraj_icon.svg -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher.png
        convert -background none assets/icon/siraj_icon.svg -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
        convert -background none assets/icon/siraj_icon.svg -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
        convert -background none assets/icon/siraj_icon.svg -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

    - name: Install Dependencies
      run: flutter pub get

    - name: Build APK
      run: flutter build apk --split-per-abi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
        
