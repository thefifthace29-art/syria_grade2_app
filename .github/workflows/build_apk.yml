name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Generate Android Project Files
      run: flutter create . --platforms=android --project-name=syria_grade2_app

    - name: Set App Display Name
      run: |
        sed -i 's/android:label="syria_grade2_app"/android:label="سِراج"/g' android/app/src/main/AndroidManifest.xml
        sed -i 's/android:label="@string/app_name"/android:label="سِراج"/g' android/app/src/main/AndroidManifest.xml

    - name: Install Dependencies
      run: flutter pub get

    - name: Build APK
      run: flutter build apk --split-per-abi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
        
