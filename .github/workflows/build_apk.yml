name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Recreate Android Project
        run: |
          rm -rf android
          flutter create . --org com.siraj.app --project-name syria_grade2_app --platforms=android

      - name: Upgrade Android Gradle Plugin & SDK 35
        run: |
          # 1. تحديث compileSdk و targetSdk إلى 35
          sed -i 's/compileSdkVersion.*/compileSdkVersion 35/' android/app/build.gradle || true
          sed -i 's/compileSdk = .*/compileSdk = 35/' android/app/build.gradle || true
          sed -i 's/targetSdkVersion.*/targetSdkVersion 35/' android/app/build.gradle || true
          sed -i 's/targetSdk = .*/targetSdk = 35/' android/app/build.gradle || true
          
          # 2. ترقية Android Gradle Plugin إلى إصدار حديث يدعم SDK 35
          sed -i 's/com.android.tools.build:gradle:.*/com.android.tools.build:gradle:8.3.0"/' android/build.gradle || true
          
          # 3. ترقية Gradle Wrapper إلى 8.4
          sed -i 's/gradle-.*-all.zip/gradle-8.4-bin.zip/' android/gradle/wrapper/gradle-wrapper.properties || true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
